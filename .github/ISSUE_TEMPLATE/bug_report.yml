name: Bug report
description: Something does not work the way the documentation says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please remove tokens, private host names and anything else you would not post in public.
        Security problems do not belong here. Follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the publish target to GitHub
        2. Choose Publish site
        3. …
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Build log
      description: Copy the log from the Publish tab, or the output of `wp wp2vercel status` and `wp wp2vercel failures`.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: WP2Vercel version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Publish target
      options:
        - GitHub
        - Vercel
        - This server only
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Anything else about the setup
      description: Hosting, multisite, page builder, multilingual plugin, caching plugin, reverse proxy or access gateway.
